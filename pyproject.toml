[project]
name = "fuel-parser"
version = "0.7.0"
description = "Converts FUEL Google Forms response exports into the FUEL MASTERLIST import format."
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1,<4", "PyYAML>=6,<7"]

[project.optional-dependencies]
ui = ["streamlit>=1.30"]
dev = ["pytest>=8"]

[project.scripts]
fuel-parser = "fuel_parser.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fuel_parser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
