  "Ownsource": {to: "Own Source"}
  "Booth": {to: "Booth Manning"}
  "Digital":
    by_detail: digital_v1
    when:
      "Seller Facebook Page": {to: "Digital - Seller Social Media", detail_to: digital_seller}
      "Facebook Marketplace": {to: "Digital - Seller Social Media", detail_to: digital_seller}
      "Tiktok Inquiry": {to: "Digital - Seller Social Media", detail_to: digital_seller}
      "Project's Main Page": {to: "Digital - Official Social Media", detail_to: digital_official}

